[package]
name = "secret-broker"
version = "0.1.0"
edition.workspace = true
description = "Attested secret lifecycle and short-lived credential broker"

[dependencies]
anyhow.workspace = true
async-trait = "0.1"
aes-gcm = "0.10"
base64.workspace = true
blake3 = "1.5"
chrono.workspace = true
chacha20poly1305 = "0.10"
dcap-qvl = "0.3"
fips203 = "0.4"
futures = "0.3"
hex = "0.4"
hmac = "0.12"
libc = "0.2"
ml-dsa = { version = "=0.1.0-rc.2", default-features = false }
once_cell = "1.19"
parking_lot = "0.12"
p256 = { version = "0.13", default-features = false, features = ["arithmetic", "std"] }
pin-project = "1.1"
prometheus = "0.13"
prost.workspace = true
prost-types.workspace = true
rand = "0.8"
rustls = "0.23"
rustls-pemfile = "2.0"
serde.workspace = true
serde-human-bytes = "0.1"
serde_json.workspace = true
sha2 = "0.10"
sled = "0.34"
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio-rustls", "uuid", "chrono"] }
subtle = "2.5"
thiserror = "1.0"
tokio.workspace = true
tokio-rustls = "0.26"
tokio-stream = { version = "0.1", features = ["net"] }
toml = "0.8"
tonic.workspace = true
tonic-prost.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url = "2.5"
uuid.workspace = true
x509-parser = "0.16"
yasna = "0.5"
zeroize.workspace = true

[build-dependencies]
tonic-prost-build.workspace = true

[dev-dependencies]
rcgen = { version = "0.13.2", features = ["x509-parser", "pem"] }
tempfile = "3.10"
