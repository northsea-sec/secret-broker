syntax = "proto3";

package secretbroker.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";


// Secret Broker gRPC API.
service SecretBrokerService {
  // Delete a previously issued secret handle.
  rpc DeleteSecret(DeleteSecretRequest) returns (google.protobuf.Empty);

  // Mint a v2 AEAD key capability using macaroon caveats and optional threshold shares.
  rpc MintAeadKeyV2(MintAeadKeyV2Request) returns (MintAeadKeyV2Response);

  // Wrap and store a secret under a real v2 macaroon handle.
  rpc WrapSecretV2(WrapSecretV2Request) returns (WrapSecretResponse);

  // Retrieve and decrypt a v2 secret using a macaroon handle and either a token
  // or a threshold share set, plus any required caveat context.
  rpc UnwrapSecretV2(UnwrapSecretV2Request) returns (UnwrapSecretResponse);

  // Add further first-party caveats to an existing v2 macaroon handle.
  rpc AttenuateHandleV2(AttenuateHandleV2Request) returns (AttenuateHandleV2Response);

  // Issue temporary Postgres credentials.
  rpc IssuePostgresCredentials(IssuePostgresCredentialsRequest)
      returns (IssuePostgresCredentialsResponse);

  // Administrative crypto operations backed by the broker-owned crypto engine.
  rpc CryptoEncrypt(CryptoEncryptRequest) returns (CryptoEncryptResponse);
  rpc CryptoDecrypt(CryptoDecryptRequest) returns (CryptoDecryptResponse);
  rpc CryptoSign(CryptoSignRequest) returns (CryptoSignResponse);
  rpc CryptoVerify(CryptoVerifyRequest) returns (CryptoVerifyResponse);
  rpc CryptoKeygen(CryptoKeygenRequest) returns (CryptoKeygenResponse);
  rpc CryptoRandom(CryptoRandomRequest) returns (CryptoRandomResponse);
  rpc CryptoPubkey(CryptoPubkeyRequest) returns (CryptoPubkeyResponse);

  // Basic health probe.
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);

  // Returns per-channel metadata such as TLS exporter bindings.
  rpc DescribeChannel(DescribeChannelRequest) returns (DescribeChannelResponse);

  // Renew the lease on a RenewableLease secret, extending its access window.
  rpc RenewLease(RenewLeaseRequest) returns (RenewLeaseResponse);

  // Explicitly revoke a secret, making it permanently inaccessible.
  rpc RevokeSecret(RevokeSecretRequest) returns (RevokeSecretResponse);

  // Atomically wrap a new secret and revoke an old one (key rotation).
  rpc RotateSecret(RotateSecretRequest) returns (RotateSecretResponse);
  // Mint a discharge macaroon for a third-party caveat condition.
  rpc MintDischarge(MintDischargeRequest) returns (MintDischargeResponse);

  // Phase 6a: Distribute a single threshold share to a specific custodian.
  rpc DistributeShare(DistributeShareRequest) returns (DistributeShareResponse);

  // Phase 6a: Combine k-of-n shares from distinct custodians to reconstruct redeem material.
  rpc CombineShares(CombineSharesRequest) returns (CombineSharesResponse);

  // Phase 6a: Authenticated custodian claims their assigned share.
  rpc ClaimShare(ClaimShareRequest) returns (ClaimShareResponse);
}


// A third-party caveat to add during attenuation.
message ThirdPartyCaveat {
  string location = 1;
  string condition = 2;
}

// A discharge macaroon that satisfies a third-party caveat.
message DischargeToken {
  // Serialized discharge macaroon (base64).
  string token = 1;
}

message WrapSecretResponse {
  string handle = 1;
  google.protobuf.Timestamp created_at = 2;
  google.protobuf.Timestamp expires_at = 3;
  // Raw redeem token bytes. Clients MUST treat this as opaque binary, not a
  // base64-encoded string.
  bytes redeem_token = 4;
  google.protobuf.Timestamp redeem_token_expires_at = 5;
}

message WrapSecretV2Request {
  bytes plaintext = 1;
  string customer_id = 2;
  google.protobuf.Struct metadata = 3;
  SecretLifecycle lifecycle = 4;
  uint64 initial_lease_seconds = 5;
  string label = 6;
  string tenant_id = 7;
  string provider = 8;
  string circuit_id = 9;
  string node_id = 10;
  // Authoritative unwrap principal binding for lifecycle-sensitive v2 secrets.
  // SingleUseUnwrap is bound to the authenticated caller when omitted; when set
  // it must exactly match that caller. RenewableLease / ServiceBootstrap require
  // an authenticated channel; when omitted they bind to the authenticated caller,
  // and when set they request an explicit cross-principal target.
  string unwrap_principal_id = 11;
  // Optional hard TTL in seconds for the wrapped secret itself.
  uint64 ttl_seconds = 12;
}


message UnwrapSecretResponse {
  bytes plaintext = 1;
}

message DeleteSecretRequest {
  string handle = 1;
}


message ThresholdShare {
  uint32 x = 1;
  bytes y = 2;
}

message MintAeadKeyV2Request {
  // Desired TTL in seconds (optional).
  uint64 ttl_seconds = 1;
  // Optional label recorded for auditing.
  string label = 2;
  // Optional first-party caveats to embed in the macaroon.
  string tenant_id = 3;
  string provider = 4;
  // Threshold parameters. Omitted or 1 selects single-token mode.
  uint32 threshold = 5;
  uint32 num_shares = 6;
  // Lifecycle class. Defaults to SINGLE_USE_UNWRAP if unset.
  SecretLifecycle lifecycle = 7;
  // For RENEWABLE_LEASE: initial lease duration in seconds.
  uint64 initial_lease_seconds = 8;
  // Phase 6a: Custodian identifiers for share distribution.
  // When non-empty and threshold > 1, broker holds shares internally
  // and custodians claim them via ClaimShare. Shares are NOT returned
  // in the response. Length must equal num_shares.
  repeated string custodian_ids = 9;
  // Authoritative unwrap principal binding for lifecycle-sensitive v2 secrets.
  // SingleUseUnwrap is bound to the authenticated caller when omitted; when set
  // it must exactly match that caller. RenewableLease / ServiceBootstrap require
  // an authenticated channel; when omitted they bind to the authenticated caller,
  // and when set they request an explicit cross-principal target.
  string unwrap_principal_id = 10;
}

message MintAeadKeyV2Response {
  bytes key = 1;
  string handle = 2;
  google.protobuf.Timestamp expires_at = 3;
  // Present when threshold <= 1. Raw redeem token bytes; consumers MUST treat
  // this as opaque binary, not a base64-encoded string.
  bytes redeem_token = 4;
  // Present when threshold > 1.
  repeated ThresholdShare redeem_shares = 5;
  google.protobuf.Timestamp redeem_token_expires_at = 6;
  uint32 threshold = 7;
  uint32 num_shares = 8;
}

message UnwrapSecretV2Request {
  string handle = 1;
  // Present when using single-token mode. Raw redeem token bytes; clients MUST
  // send the broker-issued binary token unchanged, not a base64-encoded string.
  bytes redeem_token = 2;
  // Present when using threshold-share mode.
  repeated ThresholdShare redeem_shares = 3;
  // Optional first-party caveat context.
  string tenant_id = 4;
  string provider = 5;
  string circuit_id = 6;
  string node_id = 7;
  // Discharge tokens for third-party caveats.
  repeated DischargeToken discharges = 8;
}

message AttenuateHandleV2Request {
  string handle = 1;
  string tenant_id = 2;
  string provider = 3;
  string circuit_id = 4;
  string node_id = 5;
  string action = 6;
  uint32 max_uses = 7;
  // Third-party caveat to add (requires a discharge from the location service).
  ThirdPartyCaveat third_party = 8;
}

message AttenuateHandleV2Response {
  string handle = 1;
  // Present when attenuation added a new third-party caveat. This is the
  // opaque caveat identifier that later discharge minting should prefer over a
  // caller-supplied clear predicate.
  string third_party_caveat_id = 2;
}

message IssuePostgresCredentialsRequest {
  string audience = 1;
  repeated string scope = 2;
  uint64 ttl_seconds = 3;
  string application_name = 4;
}

message IssuePostgresCredentialsResponse {
  string database_url = 1;
  string username = 2;
  string password = 3;
  google.protobuf.Timestamp expires_at = 4;
  string ca_certificate_pem = 5;
  string server_cert_fingerprint = 6;
}

message CryptoEncryptRequest {
  string key_id = 1;
  bytes plaintext = 2;
  string algorithm = 3;
  string customer_id = 4;
}

message CryptoEncryptResponse {
  bytes ciphertext = 1;
  string key_id = 2;
  bytes nonce = 3;
}

message CryptoDecryptRequest {
  string key_id = 1;
  bytes ciphertext = 2;
  string algorithm = 3;
  string customer_id = 4;
}

message CryptoDecryptResponse {
  bytes plaintext = 1;
  bool verified = 2;
}

message CryptoSignRequest {
  string key_id = 1;
  bytes data = 2;
}

message CryptoSignResponse {
  bytes signature = 1;
}

message CryptoVerifyRequest {
  string key_id = 1;
  bytes data = 2;
  bytes signature = 3;
}

message CryptoVerifyResponse {
  bool valid = 1;
}

message CryptoKeygenRequest {
  string algorithm = 1;
  string customer_id = 2;
}

message CryptoKeygenResponse {
  string key_id = 1;
  bytes public_key = 2;
  string algorithm = 3;
}

message CryptoRandomRequest {
  uint32 length = 1;
}

message CryptoRandomResponse {
  bytes random = 1;
  uint32 length = 2;
}

message CryptoPubkeyRequest {
  string key_id = 1;
}

message CryptoPubkeyResponse {
  string key_id = 1;
  bytes public_key = 2;
}

message HealthCheckRequest {}

message HealthCheckResponse {
  string status = 1;
  google.protobuf.Timestamp checked_at = 2;
}

// Provides authoritative metadata for the currently authenticated channel.
message DescribeChannelRequest {}

message DescribeChannelResponse {
  // Server-issued session identifier for the active connection.
  string session_id = 1;
  // Raw TLS exporter secret (32 bytes) bound to this connection.
  bytes tls_exporter = 2;
  // SHA-256 hash of the TLS exporter secret (mirrors transparency logs).
  bytes tls_exporter_hash = 3;
  // Whether the broker derived this context from an authenticated transport.
  // Lifecycle-sensitive V2 operations MUST fail closed when this is false.
  bool authenticated_transport = 4;
  // Authenticated broker principal derived from the peer identity, when present.
  // Lifecycle-sensitive V2 bindings use this value as the authoritative principal.
  string principal_id = 5;
  // SHA-256 fingerprint of the presented peer certificate, when available.
  // RenewableLease / ServiceBootstrap rely on this lineage being present.
  bytes peer_cert_sha256 = 6;
  // Verified attestation digest derived from the peer certificate, when available.
  bytes attestation_digest = 7;
}

// Lifecycle class for sealed secrets.
enum SecretLifecycle {
  // One wrap, one unwrap, then inert. Default for all existing handles.
  SECRET_LIFECYCLE_SINGLE_USE_UNWRAP = 0;
  // Repeated unwrap as long as the lease is active (not expired, not revoked).
  SECRET_LIFECYCLE_RENEWABLE_LEASE = 1;
  // Unwrapped once at service startup; distinct audit semantics.
  SECRET_LIFECYCLE_SERVICE_BOOTSTRAP = 2;
}

message RenewLeaseRequest {
  // The handle to renew (v1 or v2 format).
  string handle = 1;
  // New lease duration in seconds from now.
  uint64 lease_duration_seconds = 2;
}

message RenewLeaseResponse {
  // When the renewed lease now expires.
  google.protobuf.Timestamp lease_expires_at = 1;
  // How many times this lease has been renewed (including this renewal).
  uint32 renewal_count = 2;
}

message RevokeSecretRequest {
  // The handle to revoke.
  string handle = 1;
  // Optional human-readable reason for auditing.
  string reason = 2;
}

message RevokeSecretResponse {
  // True if the secret was found and revoked; false if it was already absent.
  bool revoked = 1;
  // When the revocation took effect.
  google.protobuf.Timestamp revoked_at = 2;
}

message RotateSecretRequest {
  // The old handle to revoke after the new secret is wrapped.
  string old_handle = 1;
  // The new plaintext to wrap.
  bytes new_plaintext = 2;
  // Optional customer override for the new secret.
  string customer_id = 3;
  // Optional metadata for the new secret.
  google.protobuf.Struct metadata = 4;
  // Optional TTL for the new secret in seconds.
  uint64 ttl_seconds = 5;
  // Lifecycle class for the new secret. Defaults to SINGLE_USE_UNWRAP.
  SecretLifecycle lifecycle = 6;
  // Reason for rotating (recorded on the old handle's revocation).
  string rotation_reason = 7;
  // Threshold parameters for the new secret. Omitted or 0/1 selects single-token mode.
  uint32 threshold = 8;
  uint32 num_shares = 9;
}

message RotateSecretResponse {
  // The new handle for the rotated secret.
  string new_handle = 1;
  // When the new secret was created.
  google.protobuf.Timestamp created_at = 2;
  // When the new secret expires (if TTL was set).
  google.protobuf.Timestamp expires_at = 3;
  // Raw redeem token bytes for the new secret. Consumers MUST treat this as
  // opaque binary, not a base64-encoded string.
  bytes redeem_token = 4;
  // When the redeem token expires.
  google.protobuf.Timestamp redeem_token_expires_at = 5;
  // Whether the old secret was successfully revoked.
  bool old_revoked = 6;
  // Phase 6b: Threshold shares for the new secret (present when threshold > 1).
  repeated ThresholdShare new_shares = 7;
}

message MintDischargeRequest {
  // The third-party location this discharge is for.
  string location = 1;
  // Canonical v2 handle whose third-party caveat this discharge must bind to.
  string primary_handle = 2;
  // Opaque selector for the third-party caveat to satisfy.
  string caveat_id = 3;
}

message MintDischargeResponse {
  // Serialized discharge macaroon (base64).
  string discharge_token = 1;
}

// Phase 6a: Distribute a single share to a custodian endpoint.
message DistributeShareRequest {
  // Handle of the secret whose shares are being distributed.
  string handle = 1;
  // Share index (1-based).
  uint32 share_index = 2;
  // The share material.
  ThresholdShare share = 3;
  // Custodian identifier (e.g., service name, operator ID).
  string custodian_id = 4;
}

message DistributeShareResponse {
  // Whether the share was accepted.
  bool accepted = 1;
  // Custodian acknowledgment token.
  string ack_token = 2;
}

// Phase 6a: Combine shares from distinct custodians.
message CombineSharesRequest {
  // Handle of the secret to reconstruct.
  string handle = 1;
  // Shares submitted by distinct custodians.
  repeated ThresholdShare shares = 2;
  // Tenant/provider context.
  string tenant_id = 3;
  string provider = 4;
  // Custodian identifiers corresponding one-for-one with submitted shares.
  // Each entry must identify a distinct custodian.
  repeated string custodian_ids = 5;
}

message CombineSharesResponse {
  // The unwrapped plaintext (only if threshold met and secret valid).
  bytes plaintext = 1;
}

// Phase 6a: Custodian claims their assigned threshold share.
message ClaimShareRequest {
  // Handle of the secret.
  string handle = 1;
  // Custodian identifier - must match the caller's authenticated identity
  // (SPIFFE ID, RA-TLS subject, or admin key fingerprint).
  string custodian_id = 2;
}

message ClaimShareResponse {
  // The custodian's assigned share.
  ThresholdShare share = 1;
  // Feldman commitment set for share verification (serialized compressed P-256 points).
  repeated bytes commitments = 2;
  // Whether this share has been claimed before.
  bool previously_claimed = 3;
}
